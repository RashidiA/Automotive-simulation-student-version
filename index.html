<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automotive Simulations Dashboard</title>
<meta name="description" content="Interactive automotive engineering simulators for students: welding, laser tracking, torque monitoring, plant processes and car anatomy.">
<style>
:root{
  --bg:#0b1220; --bg2:#101a2e; --card:#14203a; --card-hi:#1a2a4b; --line:#25365c;
  --fg:#e8eefc; --dim:#93a4c7; --accent:#4da3ff; --accent2:#7c5cff;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#eef2f9; --bg2:#e2e9f6; --card:#ffffff; --card-hi:#f5f8ff; --line:#d3ddf0;
  --fg:#14213d; --dim:#5a6b8c; --accent:#1769e0; --accent2:#6a45f0;
  --shadow:0 10px 26px rgba(30,60,120,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--fg);
  background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 60%),
             radial-gradient(900px 500px at -10% 10%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),var(--bg);
  transition:background .3s,color .3s}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em;font-size:14px;text-transform:uppercase;color:var(--dim)}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.tools{display:flex;gap:8px}
.ibtn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.ibtn:hover,.ibtn:focus-visible{border-color:var(--accent);transform:translateY(-1px);outline:none}
.hero{text-align:center;padding:46px 0 26px}
.hero h1{margin:0 0 12px;font-size:clamp(28px,5vw,48px);line-height:1.1;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.hero p{margin:0 auto;max-width:640px;color:var(--dim);font-size:clamp(14px,2vw,17px);line-height:1.55}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:26px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 20px;min-width:120px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:26px 0 18px}
.search{flex:1 1 260px;position:relative;max-width:420px}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--accent);border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{color:var(--fg);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;padding:20px;border-radius:18px;
  background:linear-gradient(160deg,var(--card-hi),var(--card));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;
  transform-style:preserve-3d;transition:transform .15s ease,border-color .2s,box-shadow .2s;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 28%,transparent),transparent 65%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover::before,.card:focus-visible::before{opacity:1}
.card:hover,.card:focus-visible{border-color:var(--c);box-shadow:0 14px 36px color-mix(in srgb,var(--c) 30%,transparent);outline:none}
.card.hide{display:none}
.ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.ic svg{width:30px;height:30px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card h2{margin:0;font-size:19px}
.card p{margin:0;color:var(--dim);font-size:14px;line-height:1.5;flex:1}
