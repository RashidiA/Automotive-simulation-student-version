<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Car Plant Process Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one landscape screen. Header with shop buttons and playback, canvas stage scene left, stage information right, stage strip across the bottom. */
:root {
  --bg: #e9edf0; --panel: #f8fafb; --ink: #14212b; --ink2: #51606c; --line: #cfd7dd;
  --cell: #e3e8ec; --floor: #c3ccd3; --frame: #8d99a3; --steel: #bcc6cf; --steelD: #7f8b96; --biw: #98a3ae;
  --c1: #b2500d; --c2: #1f5ec0; --c3: #8a3fc9; --c4: #1f8a5b; --on: #ffffff;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #182027; --ink: #e8edf1; --ink2: #9aa7b2; --line: #2a343d;
  --cell: #1c252c; --floor: #2a343c; --frame: #5b6874; --steel: #8d99a5; --steelD: #5d6975; --biw: #75818c;
  --c1: #f08a43; --c2: #6ea2f2; --c3: #c59bff; --c4: #4cc58f; --on: #0b1217; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #182027; --ink: #e8edf1; --ink2: #9aa7b2; --line: #2a343d;
  --cell: #1c252c; --floor: #2a343c; --frame: #5b6874; --steel: #8d99a5; --steelD: #5d6975; --biw: #75818c;
  --c1: #f08a43; --c2: #6ea2f2; --c3: #c59bff; --c4: #4cc58f; --on: #0b1217; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
.app { height: 100%; max-width: 1760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; }
.chip { display: inline-block; background: var(--c4); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 3px 10px; border-radius: 999px; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.shops { display: flex; flex-wrap: wrap; gap: 6px; }
.shopbtn { position: relative; border: 1.5px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 600; min-width: 0; }
.shopbtn input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.shopbtn small { display: block; font-weight: 400; font-size: 11px; color: var(--ink2); }
.shopbtn:has(input:checked) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.shopbtn:has(input:checked) small { color: var(--bg); opacity: .8; }
.shopbtn:has(input:focus-visible) { outline: 2px solid var(--c4); outline-offset: 2px; }
.shopbtn i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.play { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
button, select { font: inherit; font-size: 13px; }
button.b { cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 6px; }
button.pri { background: var(--c4); border-color: var(--c4); color: #fff; font-weight: 600; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--c4); outline-offset: 2px; }
select { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 8px; border-radius: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg label { position: relative; padding: 6px 10px; cursor: pointer; color: var(--ink2); font-size: 13px; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.scrub { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); }
.scrub input { width: 170px; accent-color: var(--c4); }
.scrub b { font-family: var(--mono); font-weight: 500; color: var(--ink); min-width: 9ch; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.stage { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.sh h2 { font-size: 16px; font-weight: 600; }
.sh span { font-size: 12px; color: var(--ink2); }
.cvwrap { flex: 1; min-height: 160px; position: relative; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.tile { padding: 6px 12px; min-width: 0; border-right: 1px solid var(--line); }
.tile:last-child { border-right: 0; }
.tile span { display: block; font-size: 11px; color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile b { font-family: var(--mono); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; }
.info { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; min-height: 0; }
.info .tag { align-self: flex-start; color: var(--on); font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; }
.info h2 { font-size: 20px; font-weight: 700; text-wrap: balance; }
.info p.t { color: var(--ink); line-height: 1.5; max-width: 62ch; }
.io { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.io div { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; background: var(--bg); }
.io div b { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.io .ar { border: 0; background: none; align-self: center; font-size: 18px; color: var(--ink2); padding: 0; }
dl.spec { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: 13px; }
dl.spec dt { color: var(--ink2); } dl.spec dd { margin: 0; min-width: 0; }
.note { font-size: 11.5px; color: var(--ink2); }
.strip { display: grid; grid-template-columns: 4fr 3fr 3fr 3fr; gap: 8px; }
.grp { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 5px 7px 7px; min-width: 0; }
.grp h3 { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.grp h3 i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.sb { border: 1px solid var(--line); background: var(--bg); color: var(--ink2); border-radius: 5px; padding: 3px 7px; font-size: 12px; cursor: pointer; text-align: left; line-height: 1.25; }
.sb em { font-style: normal; font-family: var(--mono); font-size: 10.5px; margin-right: 4px; opacity: .8; }
.sb.cur { color: var(--on); font-weight: 600; border-color: transparent; }
.sb.done { color: var(--ink); }

@media (max-width: 1099px), (max-height: 759px) {
  html, body { height: auto; } .app { height: auto; } .main { grid-template-columns: 1fr; }
  .cvwrap { flex: none; height: 300px; } .strip { grid-template-columns: 1fr 1fr; } .info { overflow: visible; }
}
@media (max-width: 560px) { .strip { grid-template-columns: 1fr; } h1 { font-size: 20px; } .tiles { grid-template-columns: repeat(2, 1fr); } .io { grid-template-columns: 1fr; } .io .ar { display: none; } .scrub input { width: 120px; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div><span class="chip">AUTOMOTIVE MANUFACTURING</span><h1>Car Plant Process Simulator</h1></div>
    <div class="shops" id="shops" role="radiogroup" aria-label="Choose what to simulate"></div>
    <div class="play">
      <button id="play" class="b pri" type="button">Pause</button>
      <button id="restart" class="b" type="button">Restart</button>
      <div class="seg" role="radiogroup" aria-label="Speed"><label>1×<input type="radio" name="sp" value="1" checked></label><label>2×<input type="radio" name="sp" value="2"></label><label>4×<input type="radio" name="sp" value="4"></label></div>
      <label class="scrub" for="paint">Paint <select id="paint"><option value="#c4262e">Red</option><option value="#2b5fb4">Blue</option><option value="#eef0f2">White</option><option value="#aab1b9">Silver</option><option value="#2f7d4f">Green</option></select></label>
      <label class="scrub" for="scrub"><input id="scrub" type="range" min="0" max="1000" value="0"><b id="tlabel"></b></label>
    </div>
  </header>

  <main class="main">
    <section class="panel stage" aria-label="Simulation">
      <div class="sh"><h2 id="stTitle"></h2><span id="stSub"></span></div>
      <div class="cvwrap"><canvas id="scene" role="img" aria-label="Animated view of the current manufacturing stage"></canvas></div>
      <div class="tiles" id="tiles"></div>
    </section>
    <section class="panel info" aria-label="Stage information" id="info"></section>
  </main>

  <nav class="strip" id="strip" aria-label="Process flow of the whole plant"></nav>
</div>

<script>

  { shop: 0, n: 'Coil steel feeder', sh: 'Coil feeder', t: 'A steel coil is mounted on the uncoiler and unwound. The leveler removes the coil set (the curl) and a servo roll feeder pushes a precise length of flat strip into the press at every stroke.', i: 'Steel coil, about 1.8 t', o: 'Flat strip, fed in steps', eq: 'Uncoiler, leveler, servo roll feeder', au: 'Fully automatic', ct: 'One feed per press stroke (about 4 s)', qc: 'Coil width, thickness and surface checked before loading' },

  { shop: 1, n: 'Robotic welding: sub-assembly line', sh: 'Sub-assembly', t: 'Small panels and reinforcements are clamped in a fixture. Robots with spot welding guns join them into sub-assemblies such as the floor, side frame and cross members. Many hundreds of spots are made per car.', i: 'Trimmed panels', o: 'Sub-assembly (floor, side, cross member)', eq: 'Spot welding robots, fixtures, clamps', au: 'Robots (above 90 % automated)', ct: 'About 60 to 90 s per sub-assembly', qc: 'Spot nugget quality and count, dimensional fit', tie: 'Nugget growth is covered in the adaptive spot welding simulator.' },
  { shop: 1, n: 'Robotic welding: main assembly line', sh: 'Main assembly', t: 'In the framing station the floor, both body sides and the roof are clamped in a geometry fixture. Robots on both sides weld them into the body-in-white (BIW) shell, so the body takes its final shape here.', i: 'Floor, body sides, roof', o: 'Body-in-white shell', eq: 'Framing fixture, welding robots on both sides', au: 'Robots (above 95 % automated)', ct: 'Takt about 55 to 60 s', qc: 'Gap and fit measured by laser, weld spot checks' },
  { shop: 1, n: 'Manual closure parts install', sh: 'Closures (doors)', t: 'Doors, hood and trunk lid are fitted by operators using lift-assist hoists. Hinge bolts are tightened with torque-controlled nutrunners, then gap and flush to the body is adjusted by hand.', i: 'BIW shell, door and hood assemblies', o: 'BIW with closures', eq: 'Hoists, nutrunners, gap and flush gauges', au: 'Manual with assist devices', ct: 'Takt about 60 s per station', qc: 'Gap and flush (about 1 mm), hinge bolt torque', tie: 'Hinge bolt torque and RFID bypass checks work like the torque line simulator.' },
